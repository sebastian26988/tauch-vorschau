name: Web-App veröffentlichen

# Lädt die App zu Cloudflare Pages hoch (Projekt „tauch-vorschau“, Direktupload wie
# beim Tauchlogbuch). Es gibt keinen Bauschritt: Die Dateien im Repo sind genau das,
# was ausgeliefert wird. Hochgeladen wird nur die App selbst, nicht README,
# CLAUDE.md oder dieser Ordner.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Secrets prüfen
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          fehlt=""
          [ -n "$TOKEN" ]   || fehlt="$fehlt CLOUDFLARE_API_TOKEN"
          [ -n "$ACCOUNT" ] || fehlt="$fehlt CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$fehlt" ]; then
            echo "::error::Diese Secrets fehlen unter Settings → Secrets and variables → Actions:$fehlt"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Tests
        run: npm test

      # Die Cache-Version des Service-Workers bekommt den Commit: Jede Veröffentlichung räumt
      # damit den alten Offline-Stand ab, ohne dass jemand die Nummer von Hand hochzählen muss.
      - name: App zusammenstellen
        run: |
          mkdir -p _site
          cp -r index.html sw.js manifest.webmanifest css js fonts icons _site/
          sed -i "s/^const CACHE = '[^']*';/const CACHE = 'tbv-${GITHUB_SHA::8}';/" _site/sw.js
          grep -q "const CACHE = 'tbv-${GITHUB_SHA::8}';" _site/sw.js

      # Das Projekt wurde ursprünglich vom PC aus angelegt und hat dort einen eigenen Produktionszweig.
      # Hochgeladen mit einem anderen Zweignamen landet der Stand nur in einer Vorschau-Adresse,
      # nicht auf tauch-vorschau.pages.dev. Deshalb den Zweig beim Projekt nachfragen statt raten.
      - name: Produktionszweig ermitteln
        id: zweig
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          zweig=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/tauch-vorschau" \
            | jq -r '.result.production_branch')
          if [ -z "$zweig" ] || [ "$zweig" = "null" ]; then
            echo "::error::Produktionszweig des Pages-Projekts nicht ermittelbar"
            exit 1
          fi
          echo "Produktionszweig: $zweig"
          echo "name=$zweig" >> "$GITHUB_OUTPUT"

      - name: Nach Cloudflare Pages hochladen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy _site --project-name=tauch-vorschau --branch="${{ steps.zweig.outputs.name }}" --commit-dirty=true

      # Prüfen, dass der neue Stand wirklich unter der Hauptadresse ausgeliefert wird
      - name: Live prüfen
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS https://tauch-vorschau.pages.dev/sw.js | grep -q "tbv-${GITHUB_SHA::8}"; then
              echo "Live: tbv-${GITHUB_SHA::8}"; exit 0
            fi
            sleep 10
          done
          echo "::error::tauch-vorschau.pages.dev liefert nicht den neuen Stand aus"
          exit 1
